services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/Rse.Api/Dockerfile
    environment:
      ConnectionStrings__Schedule: "Host=db;Port=5432;Database=schedule;Username=schedule;Password=schedule"
      Seed__File: /app/data/clinic_schedule.json
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "25080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
